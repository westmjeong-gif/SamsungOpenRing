name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - ring-short-control

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Find Android build tools
        id: buildtools
        shell: bash
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "version=$BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Android Build Tools: $BUILD_TOOLS_VERSION"

      - name: Inspect APK package and SDK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/${{ steps.buildtools.outputs.version }}/aapt"

          echo "========== APK BADGING =========="
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:" || true

      - name: Verify APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/${{ steps.buildtools.outputs.version }}/apksigner"

          echo "========== APK SIGNATURE =========="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamsungOpenRing-ShortControl
          path: app/build/outputs/apk/debug/app-debug.apk
